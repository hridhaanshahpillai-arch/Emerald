<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quick Tiles</title>
<style>
  :root { --bg:#1e1f29; --panel:#282a36; --line:#44475a; --text:#f8f8f2; --dim:#8b8fa8; --accent:#bd93f9; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px system-ui, sans-serif; user-select:none; }
  header { display:flex; align-items:center; gap:10px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0 12px 0 0; color:var(--accent); }
  button { background:var(--line); color:var(--text); border:0; border-radius:6px; padding:6px 11px; font:inherit; cursor:pointer; }
  button:hover { background:#565a75; }
  button.on { background:var(--accent); color:#1e1f29; }
  button.big { background:var(--accent); color:#1e1f29; font-weight:600; }
  main { display:flex; gap:14px; padding:14px; align-items:flex-start; flex-wrap:wrap; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; }
  .panel h2 { font-size:12px; margin:0 0 8px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
  canvas { image-rendering:pixelated; display:block; cursor:crosshair; }
  .row { display:flex; gap:6px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  #palette { display:grid; grid-template-columns:repeat(8, 26px); gap:3px; margin-top:8px; }
  #palette div { width:26px; height:26px; border-radius:4px; cursor:pointer; border:2px solid transparent; }
  #palette div.on { border-color:#fff; }
  label { color:var(--dim); display:flex; gap:4px; align-items:center; cursor:pointer; }
  .hint { color:var(--dim); font-size:12px; margin-top:6px; }
  #msg { margin-left:auto; color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Quick Tiles</h1>
  <button class="big" id="save">Save for Claude</button>
  <button id="load">Open .emerald</button>
  <select id="export" style="background:var(--line);color:var(--text);border:0;border-radius:6px;padding:6px;font:inherit">
    <option value="">Export...</option>
    <option value="cart">Cart (.emerald), choose where</option>
    <option value="level">This level as a picture (.png)</option>
    <option value="sheet">Sprite sheet as a picture (.png)</option>
  </select>
  <button id="clear">New</button>
  <input type="file" id="file" accept=".emerald" hidden>
  <span id="msg"></span>
</header>
<main>
  <div class="panel">
    <h2>Sprite <span id="num">1</span></h2>
    <canvas id="pix" width="256" height="256"></canvas>
    <div class="row">
      <button id="tPen" class="on">Pen</button>
      <button id="tFill">Fill</button>
      <button id="flipH">Flip</button>
      <button id="wipe">Clear</button>
    </div>
    <div id="palette"></div>
    <div class="row">
      <label><input type="checkbox" id="f0"> solid</label>
      <label><input type="checkbox" id="f1"> danger</label>
      <label><input type="checkbox" id="f2"> pickup</label>
      <label><input type="checkbox" id="f3"> goal</label>
    </div>
    <div class="hint">Right click picks a colour.</div>
  </div>
  <div class="panel">
    <h2>Sprites</h2>
    <canvas id="sheet" width="384" height="96"></canvas>
    <div class="hint">Click to pick. Sprite 0 is empty space.</div>
  </div>
  <div class="panel">
    <h2>Level <span id="lvnum">1</span> of 8</h2>
    <div class="row" id="tabs" style="margin:0 0 8px"></div>
    <div class="row" style="margin:0 0 8px">
      <label>width <input type="number" id="lw" min="16" max="128" step="1" style="width:56px"></label>
      <label>height <input type="number" id="lh" min="16" max="64" step="1" style="width:56px"></label>
      <span class="hint" id="screens" style="margin:0"></span>
    </div>
    <div style="max-width:780px; max-height:560px; overflow:auto"><canvas id="map"></canvas></div>
    <div class="row">
      <button id="copyPrev">Copy previous level</button>
      <button id="wipeLevel">Clear level</button>
    </div>
    <div class="hint">Size is in tiles (16 = one screen). Left paints, right click erases, Shift + click picks a tile.</div>
  </div>
</main>
<script>
const PAL = ["#1D1E26","#2B2D42","#6B3E8C","#008751","#8A5A44","#5A5D70","#B8BCCB","#FFF6F0","#FF5E7E","#FFA46B","#FFE27A","#00E756","#7AC7FF","#A99CFF","#FF8FC7","#FFD6C2"];
const SPR = 64, LEVELS = 8;
// each level: {w, h, t} in tiles; MW / MH / map are the level being edited, T its tile size on screen
let sprites, flags, levels, map, MW = 16, MH = 16, T = 32, lv = 0, cur = 1, colour = 7, tool = "pen";
const newLevel = (w, h) => ({w, h, t: new Array(w * h).fill(0)});

function blank() {
  sprites = Array.from({length: SPR}, () => new Array(64).fill(0));
  flags = new Array(SPR).fill(0);
  levels = Array.from({length: LEVELS}, () => newLevel(16, 16));
  lv = 0;
}
function store() { try { localStorage.setItem("quicktiles3", JSON.stringify({sprites, flags, levels})); } catch (e) {} }
function restore() {
  try {
    const d = JSON.parse(localStorage.getItem("quicktiles3"));
    if (d) { sprites = d.sprites; flags = d.flags; levels = d.levels; return; }
    const two = JSON.parse(localStorage.getItem("quicktiles2"));   // the 8 one-screen levels version
    if (two) { sprites = two.sprites; flags = two.flags; levels = two.levels.map(t => ({w: 16, h: 16, t})); return; }
    const old = JSON.parse(localStorage.getItem("quicktiles"));   // the first version: sprites carry over
    blank();
    if (old) { sprites = old.sprites; flags = old.flags; }
    return;
  } catch (e) {}
  blank();
}
function pickLevel(n) {
  lv = n;
  const L = levels[n];
  map = L.t; MW = L.w; MH = L.h;
  T = Math.max(8, Math.min(32, Math.floor(768 / MW)));
  $("map").width = MW * T; $("map").height = MH * T;
  $("lw").value = MW; $("lh").value = MH;
  $("screens").textContent = (MW / 16).toFixed(1).replace(".0", "") + " x " + (MH / 16).toFixed(1).replace(".0", "") + " screens";
  $("lvnum").textContent = n + 1;
  [...$("tabs").children].forEach((b, i) => b.classList.toggle("on", i === n));
  drawMap();
}
const $ = id => document.getElementById(id);
const pix = $("pix").getContext("2d"), sheet = $("sheet").getContext("2d"), mapc = $("map").getContext("2d");

function drawSprite(ctx, n, x, y, size, see) {
  const s = sprites[n], p = size / 8;
  for (let i = 0; i < 64; i++) {
    if (s[i] === 0 && see) continue;
    ctx.fillStyle = PAL[s[i]];
    ctx.fillRect(x + (i % 8) * p, y + Math.floor(i / 8) * p, p, p);
  }
}
function drawPix() {
  pix.fillStyle = "#000"; pix.fillRect(0, 0, 256, 256);
  drawSprite(pix, cur, 0, 0, 256, false);
  pix.strokeStyle = "rgba(255,255,255,.08)";
  for (let i = 1; i < 8; i++) { pix.beginPath(); pix.moveTo(i * 32, 0); pix.lineTo(i * 32, 256); pix.moveTo(0, i * 32); pix.lineTo(256, i * 32); pix.stroke(); }
  $("num").textContent = cur;
  for (let f = 0; f < 4; f++) $("f" + f).checked = (flags[cur] >> f) & 1;
}
function drawSheet() {
  sheet.fillStyle = "#000"; sheet.fillRect(0, 0, 384, 96);
  for (let n = 0; n < SPR; n++) drawSprite(sheet, n, (n % 16) * 24, Math.floor(n / 16) * 24, 24, false);
  sheet.strokeStyle = "#fff"; sheet.lineWidth = 2;
  sheet.strokeRect((cur % 16) * 24 + 1, Math.floor(cur / 16) * 24 + 1, 22, 22);
}
function drawMap() {
  mapc.fillStyle = PAL[12]; mapc.fillRect(0, 0, MW * T, MH * T);
  for (let i = 0; i < MW * MH; i++) if (map[i]) drawSprite(mapc, map[i], (i % MW) * T, Math.floor(i / MW) * T, T, true);
  mapc.strokeStyle = "rgba(255,255,255,.3)"; mapc.beginPath();   // screen edges
  for (let x = 16; x < MW; x += 16) { mapc.moveTo(x * T, 0); mapc.lineTo(x * T, MH * T); }
  for (let y = 16; y < MH; y += 16) { mapc.moveTo(0, y * T); mapc.lineTo(MW * T, y * T); }
  mapc.stroke();
}
function all() { drawPix(); drawSheet(); drawMap(); store(); }

// palette
PAL.forEach((c, i) => {
  const d = document.createElement("div"); d.style.background = c; d.onclick = () => { colour = i; paintPal(); };
  $("palette").appendChild(d);
});
function paintPal() { [...$("palette").children].forEach((d, i) => d.classList.toggle("on", i === colour)); }

function cell(e, canvas, size) {
  const r = canvas.getBoundingClientRect();
  return [Math.floor((e.clientX - r.left) / size), Math.floor((e.clientY - r.top) / size)];
}
function fill(x, y) {
  const s = sprites[cur], from = s[y * 8 + x];
  if (from === colour) return;
  const stack = [[x, y]];
  while (stack.length) {
    const [a, b] = stack.pop();
    if (a < 0 || b < 0 || a > 7 || b > 7 || s[b * 8 + a] !== from) continue;
    s[b * 8 + a] = colour;
    stack.push([a + 1, b], [a - 1, b], [a, b + 1], [a, b - 1]);
  }
}
let down = 0;
window.addEventListener("mouseup", () => { if (down) store(); down = 0; });
document.querySelectorAll("canvas").forEach(c => c.addEventListener("contextmenu", e => e.preventDefault()));

$("pix").addEventListener("mousedown", e => { down = e.button === 2 ? 2 : 1; pixAt(e); });
$("pix").addEventListener("mousemove", e => { if (down) pixAt(e); });
function pixAt(e) {
  const [x, y] = cell(e, $("pix"), 32);
  if (x < 0 || y < 0 || x > 7 || y > 7) return;
  if (down === 2) { colour = sprites[cur][y * 8 + x]; paintPal(); return; }
  if (tool === "fill") fill(x, y); else sprites[cur][y * 8 + x] = colour;
  drawPix(); drawSheet(); drawMap();
}
$("sheet").addEventListener("mousedown", e => {
  const [x, y] = cell(e, $("sheet"), 24); cur = Math.min(SPR - 1, y * 16 + x); drawPix(); drawSheet();
});
$("map").addEventListener("mousedown", e => { down = e.button === 2 ? 2 : 1; mapAt(e); });
$("map").addEventListener("mousemove", e => { if (down) mapAt(e); });
function mapAt(e) {
  const [x, y] = cell(e, $("map"), T);
  if (x < 0 || y < 0 || x >= MW || y >= MH) return;
  if (e.shiftKey) { cur = map[y * MW + x] || cur; drawPix(); drawSheet(); return; }
  map[y * MW + x] = down === 2 ? 0 : cur;
  drawMap();
}
$("tPen").onclick = () => { tool = "pen"; $("tPen").classList.add("on"); $("tFill").classList.remove("on"); };
$("tFill").onclick = () => { tool = "fill"; $("tFill").classList.add("on"); $("tPen").classList.remove("on"); };
$("flipH").onclick = () => { const s = sprites[cur]; for (let y = 0; y < 8; y++) { const r = s.slice(y * 8, y * 8 + 8).reverse(); for (let x = 0; x < 8; x++) s[y * 8 + x] = r[x]; } all(); };
$("wipe").onclick = () => { sprites[cur].fill(0); all(); };
for (let f = 0; f < 4; f++) $("f" + f).onchange = e => { flags[cur] = e.target.checked ? flags[cur] | (1 << f) : flags[cur] & ~(1 << f); store(); };
$("clear").onclick = () => { if (confirm("Start over? This clears every sprite and the map.")) { blank(); pickLevel(0); all(); } };

// saving as an Emerald cart (sprites, flags and map sections)
const hex = (n, w) => n.toString(16).padStart(w, "0");
function cartText() {
  const places = pack();
  if (!places) { $("msg").textContent = "Too big: all levels together must fit in 128 x 64 tiles. Make some smaller."; return null; }
  const table = places.map((q, i) => `{"x": ${q.x}, "y": ${q.y}, "w": ${levels[i].w}, "h": ${levels[i].h}}`).join(",\n    ");
  let out = "// made in Quick Tiles. levels[n] says where level n is in the map (in tiles).\n" +
    "// Test: arrows scroll around a level, Z / X go to the next / previous level.\n" +
    "var levels = [\n    " + table + "\n]\nvar level = 0\nvar cx = 0\nvar cy = 0\n" +
    "func update() {\n    var L = levels[level]\n" +
    "    if btn(0) { cx -= 2 }\n    if btn(1) { cx += 2 }\n    if btn(2) { cy -= 2 }\n    if btn(3) { cy += 2 }\n" +
    "    cx = clamp(cx, 0, L[\"w\"] * 8 - 128)\n    cy = clamp(cy, 0, L[\"h\"] * 8 - 128)\n" +
    "    if btnp(4) { level = (level + 1) % len(levels)\n        cx = 0\n        cy = 0 }\n" +
    "    if btnp(5) { level = (level + len(levels) - 1) % len(levels)\n        cx = 0\n        cy = 0 }\n}\n" +
    "func draw() {\n    var L = levels[level]\n    cls(12)\n    camera(cx, cy)\n    map(L[\"x\"], L[\"y\"], 0, 0, L[\"w\"], L[\"h\"])\n    camera()\n    print(\"LEVEL \" + (level + 1), 2, 2, 7)\n}\n//@sprites\n";
  for (let y = 0; y < 32; y++) {               // 4 rows of 16 sprites = 32 pixel rows
    let line = "//";
    for (let x = 0; x < 128; x++) line += hex(sprites[Math.floor(y / 8) * 16 + Math.floor(x / 8)][(y % 8) * 8 + x % 8], 1);
    out += line + "\n";
  }
  out += "//@flags\n//" + flags.map(f => hex(f, 2)).join("") + "\n//@map\n";
  const big = new Array(128 * 64).fill(0);
  places.forEach((q, i) => { const L = levels[i]; for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) big[(q.y + y) * 128 + q.x + x] = L.t[y * L.w + x]; });
  let last = 0;
  for (let i = 0; i < big.length; i++) if (big[i]) last = Math.floor(i / 128);
  for (let y = 0; y <= last; y++) {
    let line = "//";
    for (let x = 0; x < 128; x++) line += hex(big[y * 128 + x], 2);
    out += line + "\n";
  }
  return out;
}
$("save").onclick = () => {
  const out = cartText();
  if (!out) return;
  download(new Blob([out], {type: "text/plain"}), "mygame.emerald");
  $("msg").textContent = "Saved mygame.emerald to Downloads. Tell Claude!";
};
function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
// a picture 4 times bigger with sharp pixels: w x h tiles, tile(x, y) gives the sprite number
function picture(w, h, tile, sky) {
  const c = document.createElement("canvas"); c.width = w * 32; c.height = h * 32;
  const g = c.getContext("2d");
  if (sky) { g.fillStyle = PAL[12]; g.fillRect(0, 0, c.width, c.height); }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const n = tile(x, y); if (n || !sky) drawSprite(g, n, x * 32, y * 32, 32, sky); }
  return new Promise(r => c.toBlob(r));
}
$("export").onchange = async e => {
  const what = e.target.value; e.target.value = "";
  if (what === "cart") {
    const out = cartText();
    if (!out) return;
    if (window.showSaveFilePicker) {   // Chrome / Edge: pick the folder, e.g. Emerald\carts
      try {
        const h = await showSaveFilePicker({suggestedName: "mygame.emerald", types: [{description: "Emerald cart", accept: {"text/plain": [".emerald"]}}]});
        const w = await h.createWritable(); await w.write(out); await w.close();
        $("msg").textContent = "Exported " + h.name + ". In Emerald: LOAD " + h.name.replace(".emerald", "").toUpperCase();
      } catch (err) { /* cancelled */ }
    } else { download(new Blob([out], {type: "text/plain"}), "mygame.emerald"); $("msg").textContent = "Saved mygame.emerald to Downloads."; }
  }
  if (what === "level") { download(await picture(MW, MH, (x, y) => map[y * MW + x], true), "level-" + (lv + 1) + ".png"); $("msg").textContent = "Saved level-" + (lv + 1) + ".png"; }
  if (what === "sheet") { download(await picture(16, 4, (x, y) => y * 16 + x, false), "sprites.png"); $("msg").textContent = "Saved sprites.png"; }
};
// where each level goes in Emerald's 128 x 64 map: left to right in shelves, a new shelf when a row is full
function pack() {
  const out = []; let x = 0, y = 0, shelf = 0;
  for (const L of levels) {
    if (x + L.w > 128) { x = 0; y += shelf; shelf = 0; }
    if (y + L.h > 64) return null;
    out.push({x, y}); x += L.w; shelf = Math.max(shelf, L.h);
  }
  return out;
}
$("load").onclick = () => $("file").click();
$("file").onchange = async e => {
  const text = await e.target.files[0].text(); blank();
  const big = new Array(128 * 64).fill(0), table = [];
  for (const m of text.matchAll(/\{"x": (\d+), "y": (\d+), "w": (\d+), "h": (\d+)\}/g)) table.push(m.slice(1).map(Number));
  let part = "", row = 0;
  for (const raw of text.split(/\r?\n/)) {
    if (raw.startsWith("//@")) { part = raw.slice(3); row = 0; continue; }
    if (!raw.startsWith("//") || !part) continue;
    const d = raw.slice(2);
    if (part === "sprites" && row < 32) for (let x = 0; x < 128; x++) sprites[Math.floor(row / 8) * 16 + Math.floor(x / 8)][(row % 8) * 8 + x % 8] = parseInt(d[x] || "0", 16);
    if (part === "flags") for (let n = 0; n < SPR; n++) flags[n] = parseInt(d.substr(n * 2, 2) || "0", 16);
    if (part === "map" && row < 64) for (let x = 0; x < 128; x++) big[row * 128 + x] = Math.min(SPR - 1, parseInt(d.substr(x * 2, 2) || "0", 16));
    row++;
  }
  // a Quick Tiles cart has its level table; any other cart: 8 one-screen levels along the top
  const shapes = table.length ? table.slice(0, LEVELS) : Array.from({length: LEVELS}, (_, i) => [i * 16, 0, 16, 16]);
  shapes.forEach(([x0, y0, w, h], i) => {
    const L = levels[i] = newLevel(w, h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) L.t[y * w + x] = big[(y0 + y) * 128 + x0 + x] || 0;
  });
  pickLevel(0); all();
};
function resize() {
  const L = levels[lv];
  const w = Math.max(16, Math.min(128, parseInt($("lw").value) || 16)), h = Math.max(16, Math.min(64, parseInt($("lh").value) || 16));
  const t = new Array(w * h).fill(0);   // keeps what fits, from the top left
  for (let y = 0; y < Math.min(h, L.h); y++) for (let x = 0; x < Math.min(w, L.w); x++) t[y * w + x] = L.t[y * L.w + x];
  levels[lv] = {w, h, t};
  pickLevel(lv); store();
}
$("lw").onchange = resize;
$("lh").onchange = resize;

for (let n = 0; n < LEVELS; n++) {
  const b = document.createElement("button"); b.textContent = n + 1; b.onclick = () => pickLevel(n);
  $("tabs").appendChild(b);
}
$("copyPrev").onclick = () => { if (lv > 0) { const P = levels[lv - 1]; levels[lv] = {w: P.w, h: P.h, t: P.t.slice()}; pickLevel(lv); store(); } };
$("wipeLevel").onclick = () => { if (confirm("Clear level " + (lv + 1) + "?")) { map.fill(0); drawMap(); store(); } };

restore(); paintPal(); pickLevel(0); all();
</script>
</body>
</html>
