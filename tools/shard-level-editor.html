<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHARD Level Editor</title>
<style>
  :root { --bg:#12161a; --panel:#1b2127; --line:#2b333b; --text:#e6efe9; --dim:#8a978f; --green:#00E756; --deep:#008751; --warn:#FFA46B; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 "Segoe UI", system-ui, sans-serif; display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:10px; align-items:center; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1 { font-size:16px; margin:0 8px 0 0; color:var(--green); letter-spacing:2px; }
  button, select { background:#232b33; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover, select:hover { border-color:var(--deep); }
  button.main { background:var(--deep); border-color:var(--green); }
  input[type=number] { width:62px; background:#232b33; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 6px; font:inherit; }
  main { flex:1; display:flex; min-height:0; }
  aside { width:300px; background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding:8px 10px; }
  aside h2 { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin:10px 2px 6px; }
  .tools { display:grid; grid-template-columns:1fr 1fr; gap:4px; }
  .tool { text-align:left; padding:5px 8px; }
  .tool.on { background:#0f3a26; border-color:var(--green); }
  #sheet { image-rendering:pixelated; cursor:pointer; display:block; background:#7AC7FF; border-radius:4px; }
  #picked { margin-top:6px; color:var(--dim); min-height:20px; }
  #wrap { flex:1; overflow:auto; padding:16px; }
  #map { image-rendering:pixelated; cursor:crosshair; box-shadow:0 0 0 1px var(--line); }
  footer { padding:6px 12px; background:var(--panel); border-top:1px solid var(--line); color:var(--dim); display:flex; gap:16px; flex-wrap:wrap; }
  #status.warn { color:var(--warn); }
  #status.ok { color:var(--green); }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--deep); border-radius:10px; width:min(900px, 92vw); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  textarea { width:100%; height:50vh; background:#0d1013; color:var(--green); border:1px solid var(--line); border-radius:6px; font:12px/1.25 Consolas, monospace; white-space:pre; }
  .row { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
  .help { color:var(--dim); font-size:12px; margin:10px 2px; }
</style>
</head>
<body>
<header>
  <h1>SHARD LEVELS</h1>
  <select id="level"></select>
  <button id="export" class="main">Export code</button>
  <button id="import">Import code</button>
  <button id="undo" disabled>Undo (Ctrl+Z)</button>
  <button id="reset">Reset level</button>
  <label>Width <input id="w" type="number" min="30" max="256"></label>
  <label>Height <input id="h" type="number" min="16" max="128"></label>
  <label>Zoom <select id="zoom"><option>2</option><option selected>3</option><option>4</option><option>5</option></select></label>
  <label><input type="checkbox" id="grid" checked> Grid</label>
  <label><input type="checkbox" id="auto" checked> Auto edges</label>
</header>
<main>
  <aside>
    <h2>Tools</h2>
    <div class="tools">
      <button class="tool on" data-tool="tile">Paint tile</button>
      <button class="tool" data-tool="erase">Eraser</button>
      <button class="tool" data-tool="ground0">Grass ground</button>
      <button class="tool" data-tool="ground1">Stone ground</button>
      <button class="tool" data-tool="ground2">Ice ground</button>
      <button class="tool" data-tool="pip">Pip starts here</button>
    </div>
    <h2>Every tile</h2>
    <canvas id="sheet"></canvas>
    <div id="picked"></div>
    <p class="help">Left click paints, right click erases, Shift + drag fills a box, Alt + click picks up a tile from the level. Ground brushes pick the right edges by themselves.</p>
  </aside>
  <div id="wrap"><canvas id="map"></canvas></div>
</main>
<dialog id="box">
  <p id="boxText"></p>
  <textarea id="code" spellcheck="false"></textarea>
  <div class="row"><button id="boxGo" class="main"></button><button id="boxClose">Close</button></div>
</dialog>
<footer><span id="pos">-</span><span id="status"></span></footer>

const PALETTE = [0x1D1E26,0x2B2D42,0x6B3E8C,0x008751,0x8A5A44,0x5A5D70,0xB8BCCB,0xFFF6F0,0xFF5E7E,0xFFA46B,0xFFE27A,0x00E756,0x7AC7FF,0xA99CFF,0xFF8FC7,0xFFD6C2];
const FIRST = 64;   // the sheet before this is Pip and friends, not level tiles
const NAMES = {96:"Spikes", 97:"Ceiling spikes", 100:"Spring", 102:"Crumbling block", 104:"Ledge (left end)", 105:"Ledge (middle)", 106:"Ledge (right end)",
  107:"Dash crystal", 161:"Wall crystal (run up the next wall)", 109:"Shard (level end)", 110:"Berry", 144:"Falling icicle", 153:"Cracked ice", 156:"Snow sprite (enemy)", 158:"Ice bat (enemy)"};
const SETS = [64, 80, 128];   // grass, stone, ice: 16 tiles each, by which sides are open (+1 up, +2 down, +4 left, +8 right)

const $ = id => document.getElementById(id);
const map = $("map"), ctx = map.getContext("2d");
let level = 0, L, undo = [], tool = "tile", tile = 64, dirty = false;

function status(text, kind) { $("status").textContent = text; $("status").className = kind || ""; }
function name(t) { return NAMES[t] || (groundSet(t) >= 0 ? ["Grass", "Stone", "Ice"][groundSet(t)] + " ground" : "Tile " + t); }

// the sprite sheet as an image
const sheet = document.createElement("canvas");
sheet.width = sheet.height = 128;
{
  const img = new ImageData(128, 128);
  SHEET_ROWS.forEach((row, y) => { for (let x = 0; x < row.length; x++) {
    const c = parseInt(row[x], 16); if (!c) continue;
    const v = PALETTE[c], i = (y * 128 + x) * 4;
    img.data[i] = v >> 16; img.data[i + 1] = v >> 8 & 255; img.data[i + 2] = v & 255; img.data[i + 3] = 255;
  } });
  sheet.getContext("2d").putImageData(img, 0, 0);
}
function spr(g, n, x, y, size) { g.drawImage(sheet, (n % 16) * 8, Math.floor(n / 16) * 8, 8, 8, x, y, size, size); }

// ---------- levels ----------
function fromStart(n) { const s = START[n]; return { sx: s.sx, sy: s.sy, t: s.rows.map(r => r.match(/../g).map(h => parseInt(h, 16))) }; }
function hex(lv) { return lv.t.map(r => r.map(v => v.toString(16).padStart(2, "0")).join("")); }
function stored(n) { try { const s = localStorage.getItem("shard-tiles-" + n); return s && JSON.parse(s); } catch (e) { return null; } }
function load(n) { const s = stored(n); return s ? { sx: s.sx, sy: s.sy, t: s.rows.map(r => r.match(/../g).map(h => parseInt(h, 16))) } : fromStart(n); }
function keep() {
  if (!dirty) return;
  try { localStorage.setItem("shard-tiles-" + level, JSON.stringify({ sx: L.sx, sy: L.sy, rows: hex(L) })); } catch (e) {}
  dirty = false;
}
function changed() { return START.map((_, n) => n).filter(n => { const s = stored(n); return s && (s.rows.join() !== START[n].rows.join() || s.sx !== START[n].sx || s.sy !== START[n].sy); }); }
function W() { return L.t[0].length; }
function H() { return L.t.length; }

function openLevel(n) {
  keep();
  level = n; L = load(n);
  undo = []; $("undo").disabled = true;
  draw(); checks();
}

// ---------- ground edges ----------
function groundSet(t) { return SETS.findIndex(b => t >= b && t < b + 16); }
function solid(x, y) {
  if (x < 0 || x >= W()) return true;   // the level's sides count as walls
  if (y < 0) return false;
  if (y >= H()) return true;
  return groundSet(L.t[y][x]) >= 0;
}
function retile(x, y) {
  if (x < 0 || y < 0 || x >= W() || y >= H()) return;
  const s = groundSet(L.t[y][x]);
  if (s < 0) return;
  let m = 0;
  if (!solid(x, y - 1)) m |= 1;
  if (!solid(x, y + 1)) m |= 2;
  if (!solid(x - 1, y)) m |= 4;
  if (!solid(x + 1, y)) m |= 8;
  L.t[y][x] = SETS[s] + m;
}

function paint(x, y, erase) {
  if (x < 0 || y < 0 || x >= W() || y >= H()) return;
  let edges = $("auto").checked;
  if (erase || tool === "erase") L.t[y][x] = 0;
  else if (tool === "pip") { L.sx = x; L.sy = y + 1; dirty = true; return; }
  else if (tool.startsWith("ground")) { L.t[y][x] = SETS[+tool.slice(6)]; edges = true; }
  else L.t[y][x] = tile;
  if (edges) for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) retile(x + i, y + j);
  dirty = true;
}

// ---------- drawing ----------
function draw() {
  const z = +$("zoom").value * 8;
  map.width = W() * z; map.height = H() * z;
  ctx.imageSmoothingEnabled = false;
  const sky = PALETTE[START[level].sky];
  ctx.fillStyle = `rgb(${sky >> 16},${sky >> 8 & 255},${sky & 255})`;
  ctx.fillRect(0, 0, map.width, map.height);
  for (let y = 0; y < H(); y++) for (let x = 0; x < W(); x++) if (L.t[y][x]) spr(ctx, L.t[y][x], x * z, y * z, z);
  // Pip, standing where he starts
  const s = z / 8;
  ctx.globalAlpha = .85;
  ctx.drawImage(sheet, 0, 0, 16, 16, (L.sx * 8 - 4) * s, (L.sy * 8 - 16) * s, 16 * s, 16 * s);
  ctx.globalAlpha = 1;
  if ($("grid").checked) {
    ctx.strokeStyle = "rgba(0,0,0,.12)"; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x <= W(); x++) { ctx.moveTo(x * z + .5, 0); ctx.lineTo(x * z + .5, H() * z); }
    for (let y = 0; y <= H(); y++) { ctx.moveTo(0, y * z + .5); ctx.lineTo(W() * z, y * z + .5); }
    ctx.stroke();
  }
  if (box) {
    const [x0, y0, x1, y1] = boxRect();
    ctx.strokeStyle = "#00E756"; ctx.lineWidth = 2;
    ctx.strokeRect(x0 * z + 1, y0 * z + 1, (x1 - x0 + 1) * z - 2, (y1 - y0 + 1) * z - 2);
  }
}

// the tile picker: every level tile in the sheet
const pickCanvas = $("sheet"), pg = pickCanvas.getContext("2d"), PS = 17;
const ROWS = Math.ceil((SHEET_ROWS.findLastIndex(r => /[1-9a-f]/.test(r)) + 1) / 8) - FIRST / 16;
function drawPicker() {
  pickCanvas.width = 16 * PS; pickCanvas.height = ROWS * PS;
  pg.imageSmoothingEnabled = false;
  for (let i = 0; i < ROWS * 16; i++) spr(pg, FIRST + i, (i % 16) * PS, Math.floor(i / 16) * PS, 16);
  if (tool === "tile") {
    const i = tile - FIRST;
    pg.strokeStyle = "#00E756"; pg.lineWidth = 2;
    pg.strokeRect((i % 16) * PS + 1, Math.floor(i / 16) * PS + 1, 15, 15);
  }
  $("picked").textContent = tool === "tile" ? `${name(tile)} (${tile})` : "";
}
pickCanvas.addEventListener("click", e => {
  const r = pickCanvas.getBoundingClientRect();
  const i = Math.floor((e.clientY - r.top) / PS) * 16 + Math.floor((e.clientX - r.left) / PS);
  tile = FIRST + i; setTool("tile");
});
pickCanvas.addEventListener("mousemove", e => {
  const r = pickCanvas.getBoundingClientRect();
  const t = FIRST + Math.floor((e.clientY - r.top) / PS) * 16 + Math.floor((e.clientX - r.left) / PS);
  pickCanvas.title = name(t);
});

function setTool(t) {
  tool = t;
  document.querySelectorAll(".tool").forEach(b => b.classList.toggle("on", b.dataset.tool === t));
  drawPicker();
}
document.querySelectorAll(".tool").forEach(b => b.onclick = () => setTool(b.dataset.tool));

// ---------- mouse ----------
let painting = false, erasing = false, box = null;
function at(e) { const r = map.getBoundingClientRect(), z = +$("zoom").value * 8; return [Math.floor((e.clientX - r.left) / z), Math.floor((e.clientY - r.top) / z)]; }
function boxRect() { return [Math.min(box[0], box[2]), Math.min(box[1], box[3]), Math.max(box[0], box[2]), Math.max(box[1], box[3])]; }
function remember() { undo.push({ sx: L.sx, sy: L.sy, t: L.t.map(r => r.slice()) }); if (undo.length > 200) undo.shift(); $("undo").disabled = false; }

map.addEventListener("contextmenu", e => e.preventDefault());
map.addEventListener("mousedown", e => {
  const [x, y] = at(e);
  if (e.altKey) { if (L.t[y] && L.t[y][x]) { tile = L.t[y][x]; setTool("tile"); } return; }
  remember();
  erasing = e.button === 2;
  if (e.shiftKey && tool !== "pip") { box = [x, y, x, y]; draw(); return; }
  painting = true; paint(x, y, erasing); draw();
});
window.addEventListener("mousemove", e => {
  const [x, y] = at(e);
  if (x >= 0 && y >= 0 && x < W() && y < H()) $("pos").textContent = `x ${x}  y ${y}  ${L.t[y][x] ? name(L.t[y][x]) : "empty"}`;
  if (box) { box[2] = x; box[3] = y; draw(); }
  else if (painting) { paint(x, y, erasing); draw(); }
});
window.addEventListener("mouseup", () => {
  if (box) {
    const [x0, y0, x1, y1] = boxRect();
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) paint(x, y, erasing);
    box = null; draw();
  }
  if (painting || dirty) { keep(); checks(); }
  painting = false;
});

// ---------- size ----------
// columns come and go on the right, rows at the top (so the floor stays put)
function resize() {
  const w = Math.min(256, Math.max(30, Math.round(+$("w").value) || W())), h = Math.min(128, Math.max(16, Math.round(+$("h").value) || H()));
  if (w === W() && h === H()) { checks(); return; }
  remember();
  let t = L.t.map(r => w > r.length ? r.concat(Array(w - r.length).fill(0)) : r.slice(0, w));
  if (h > H()) t = [...Array(h - H())].map(() => Array(w).fill(0)).concat(t);
  else t = t.slice(H() - h);
  L.sy += h - L.t.length;
  L.t = t;
  for (let y = 0; y < H(); y++) for (let x = 0; x < W(); x++) retile(x, y);
  dirty = true; keep(); draw(); checks();
}
$("w").onchange = resize;
$("h").onchange = resize;

// the same packing the build does: every level needs its own space in Emerald's 256x128 map
function fits() {
  const sizes = START.map((_, n) => { const t = n === level ? L.t : load(n).t; return [t[0].length, t.length]; });
  sizes.sort((a, b) => b[0] * b[1] - a[0] * a[1]);
  const used = [...Array(128)].map(() => new Uint8Array(256));
  for (const [w, h] of sizes) {
    let placed = false;
    for (let y = 0; y + h <= 128 && !placed; y++) spot: for (let x = 0; x + w <= 256; x++) {
      for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (used[j][i]) continue spot;
      for (let j = y; j < y + h; j++) used[j].fill(1, x, x + w);
      placed = true; break;
    }
    if (!placed) return false;
  }
  return true;
}

function checks() {
  const flat = L.t.flat(), problems = [];
  if (L.sx < 0 || L.sx >= W() || L.sy < 1 || L.sy > H()) problems.push("Pip starts outside the level");
  if (level !== 8 && !flat.includes(109)) problems.push("no shard, so the level can't be finished");
  if (!fits()) problems.push("all the levels together are too big for Emerald's map, so make something smaller");
  $("w").value = W(); $("h").value = H();
  if (problems.length) status("Heads up: " + problems.join(", ") + ".", "warn");
  else status("Saved in this browser. Export code when you're done.", "ok");
}

// ---------- export / import ----------
function code(n) { const lv = n === level ? L : load(n); return `LEVEL ${n} ${START[n].name}\nSTART ${lv.sx} ${lv.sy}\n${hex(lv).join("\n")}`; }
let boxAction;
function openBox(message, text, button, action) {
  $("boxText").textContent = message; $("code").value = text; $("boxGo").textContent = button; boxAction = action;
  $("box").showModal(); $("code").focus(); $("code").select();
}
$("export").onclick = () => {
  keep();
  const list = changed();
  if (!list.length) list.push(level);
  openBox(`${list.length} level${list.length > 1 ? "s" : ""} (every level you changed). Copy it and paste it to Claude.`, list.map(code).join("\n\n"), "Copy", async () => {
    try { await navigator.clipboard.writeText($("code").value); } catch (e) { $("code").select(); document.execCommand("copy"); }
    $("boxGo").textContent = "Copied!";
  });
};
$("import").onclick = () => openBox("Paste exported code here.", "", "Import", () => {
  const parts = $("code").value.split(/^LEVEL (\d+).*$/m);
  let count = 0;
  for (let i = 1; i < parts.length; i += 2) {
    const n = +parts[i], lines = parts[i + 1].split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    if (!START[n]) continue;
    const st = (lines.find(s => s.startsWith("START")) || "").split(/\s+/);
    const rows = lines.filter(s => /^[0-9a-f]+$/i.test(s));
    if (!rows.length) continue;
    try { localStorage.setItem("shard-tiles-" + n, JSON.stringify({ sx: +st[1] || 2, sy: +st[2] || 13, rows })); } catch (e) {}
    count++;
  }
  $("box").close();
  dirty = false; openLevel(level);
  status(count ? `Imported ${count} level${count > 1 ? "s" : ""}.` : "Nothing to import: the code needs LEVEL lines.", count ? "ok" : "warn");
});
$("boxGo").onclick = () => boxAction();
$("boxClose").onclick = () => $("box").close();
$("reset").onclick = () => {
  if (!confirm("Put " + START[level].name + " back the way it is in the game?")) return;
  remember();
  L = fromStart(level); dirty = true; keep(); draw(); checks();
};

$("level").onchange = e => openLevel(+e.target.value);
$("undo").onclick = () => { if (undo.length) { L = undo.pop(); dirty = true; keep(); draw(); checks(); } $("undo").disabled = !undo.length; };
$("zoom").onchange = draw;
$("grid").onchange = draw;
window.addEventListener("keydown", e => {
  if ($("box").open) return;
  if (e.ctrlKey && e.key.toLowerCase() === "z") { e.preventDefault(); $("undo").click(); }
});

START.forEach((s, n) => $("level").add(new Option(s.name, n)));
setTool("tile");
openLevel(0);
</script>
</body>
</html>
